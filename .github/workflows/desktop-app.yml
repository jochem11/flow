# Builds the desktop app (Flow) for Windows and Mac and puts the installers on a
# release, to download from the repository's Releases page.
#
# Start it by pushing a tag that begins with app-v:
#   git tag app-v0.1.0 && git push origin app-v0.1.0
# or from the Actions tab (Run workflow), which makes or updates the release "app-latest".
#
# The server the app talks to is VITE_SERVER_URL in .env.production (the login
# screen can switch to another one). The apps are not signed with a paid certificate:
# Windows shows "Windows protected your PC" (More info → Run anyway) and macOS wants
# System Settings → Privacy & Security → Open Anyway, the first time.
name: Desktop app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'app-latest' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: target/release/bundle/nsis/*.exe
          # One app for both Apple Silicon and Intel Macs
          - name: Mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the app
        run: npm run app:build -- ${{ matrix.args }}
        env:
          # Ad-hoc signing: without it an Apple Silicon Mac calls the downloaded app "damaged"
          APPLE_SIGNING_IDENTITY: "-"

      - name: Put the installer on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Flow desktop app ($RELEASE_TAG)" \
                 --notes "Installers for Windows (.exe) and Mac (.dmg). They talk to the server set in .env.production." \
            || true
          gh release upload "$RELEASE_TAG" ${{ matrix.files }} --clobber
