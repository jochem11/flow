# Builds the desktop app (Flow) for Windows and Mac and puts the installers on a
# release. Installed apps find that release themselves and offer to update.
#
# A new version: push a tag with its number, higher than the last one:
#   git tag app-v0.2.1 && git push origin app-v0.2.1
# The number after app-v becomes the app's version.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (Settings → Secrets and
# variables → Actions): the key updates are signed with, so an installed app only
# accepts updates from here. Its public half is in src-tauri/tauri.conf.json.
#
# The server the app talks to is VITE_SERVER_URL in .env.production (the login
# screen can switch to another one). The apps are not signed with a paid certificate:
# Windows shows "Windows protected your PC" (More info → Run anyway) and macOS wants
# System Settings → Privacy & Security → Open Anyway, the first time.
name: Desktop app

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          # One app for both Apple Silicon and Intel Macs
          - name: Mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: The version, from the tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.GITHUB_REF_NAME.replace(/^app-v/, "");
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
            console.log("Flow", conf.version);
          '

      # Builds, makes the release, and adds the installers and latest.json
      # (what installed apps read to see whether there is a newer version)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Ad-hoc signing: without it an Apple Silicon Mac calls the downloaded app "damaged"
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flow __VERSION__
          releaseBody: Installers for Windows (.exe) and Mac (.dmg). An installed Flow offers this update by itself.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
