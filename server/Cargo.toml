[package]
name = "flow-server"
version = "0.1.0"
description = "Flow's server: accounts, sharing, comments and real-time co-editing"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18"
dotenvy = "0.15.7"
flow-core = { path = "../crates/flow-core" }
futures-util = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true }
yrs = { version = "0.26", features = ["sync"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
