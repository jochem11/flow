[package]
name = "flow-core"
version = "0.1.0"
description = "Flow's documents and everything made from them: code, SQL, Mermaid, SVG/PNG, layout, imports"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
uuid = { workspace = true }
resvg = "0.49.0"
sqlparser = "0.63.0"
# Importing draw.io files: XML, and the compressed form of their diagrams
roxmltree = "0.21"
flate2 = "1"
base64 = "0.22"
# PDF export: a board's SVG drawing as a PDF page
krilla = "0.8"
krilla-svg = "0.8"
# The SVG reader krilla-svg is built on (an older one than resvg's)
usvg47 = { package = "usvg", version = "0.47" }
