# The Rust side of Flow:
#   crates/flow-core  models and all pure logic (exports, imports, layout), shared by:
#   src-tauri         the desktop app
#   server            accounts, sharing and co-editing (also serves the web version)
[workspace]
resolver = "3"
members = ["crates/flow-core", "server", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
uuid = { version = "1.29.0", features = ["v4"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
